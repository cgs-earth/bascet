[project]
name = "basket"
version = "0.0.1"
authors = [
  { name="Margo Atkinson", email="matkinson@lincolninst.edu" },
]
description = "basket = BASic c(K)Ensus Tables. A way to easily grab some tables from the American Community Survey."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "censusdis>=1.4.2",
    "dotenv>=0.9.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["uv_build >= 0.12.10, <0.13.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/cgs-earth/basket"
Issues = "https://github.com/cgs-earth/basket/issues"