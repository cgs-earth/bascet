[project]
name = "bascet"
version = "0.0.1"
authors = [
  { name="Margo Atkinson", email="matkinson@lincolninst.edu" },
]
description = "bascet = BASic CEnsus Tables. A way to easily grab some tables from the American Community Survey."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "censusdis>=1.4.2",
    "geopandas>=1.0.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "python-dotenv>=1.0",
]
keywords = ["census", "acs", "american community survey", "gis", "demographics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Sociology",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[build-system]
requires = ["uv_build >= 0.12.10, <0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/cgs-earth/bascet"
Issues = "https://github.com/cgs-earth/bascet/issues"
