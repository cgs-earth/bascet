name: Test

on: [ push ]

jobs:
  main:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the Python classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Make uv use the matrix Python instead of the one in .python-version.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
    - name: Install uv
      uses: astral-sh/setup-uv@v7.1.6
      with:
        # Install a specific version of uv.
        version: "0.12.10"
    - uses: actions/setup-python@v6
      name: Setup Python
      with:
          python-version: ${{ matrix.python-version }}
    - name: Install the project
      run: uv sync --all-extras --dev  # --locked
    - name: Run tests
      run: uv run pytest --rootdir=tests --cov=bascet tests

    - name: failed tests 🚩
      if: ${{ failure() }}
      run: |
        pip3 list -v